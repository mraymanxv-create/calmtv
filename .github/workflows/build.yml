          cd src
          gradle assembleDebug --no-daemon
          cp app/calmtv.keystore phone/app/calmtv.keystore
          (cd phone && gradle assembleDebug --no-daemon 2>&1 | tee ../phone.log) || echo "::error title=PHONE BUILD FAILED::$(grep -E 'error:|What went wrong|FAILED' -A2 phone.log | head -12 | tr '\n' ' ')"
          APK=phone/app/build/outputs/apk/debug/app-debug.apk
          if [ -f $APK ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
            echo "::notice title=phone-apk::$(stat -c %s $APK) bytes; $($BT/aapt2 dump badging $APK 2>&1 | head -5 | tr '\n' ' ')"
            echo "::notice title=phone-sign::$($BT/apksigner verify --verbose $APK 2>&1 | head -5 | tr '\n' ' ')"
          else
            echo "::error title=NO PHONE APK::phone apk missing"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CalmTV-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionCode \K[0-9]+' src/app/build.gradle | head -1)
          cp src/app/build/outputs/apk/debug/app-debug.apk CalmTV.apk
          if [ -f src/phone/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp src/phone/app/build/outputs/apk/debug/app-debug.apk FindPhone.apk
            gh release delete finder -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
            gh release create finder FindPhone.apk -R "$GITHUB_REPOSITORY" --title "FindPhone" --notes "Phone app" --target "$GITHUB_SHA" --latest=false || true
          fi
          gh release delete "v$V" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "v$V" CalmTV.apk -R "$GITHUB_REPOSITORY" --title "CalmTV $V" --notes "CalmTV version $V" --target "$GITHUB_SHA" --latest
