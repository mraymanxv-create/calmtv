      - uses: actions/upload-artifact@v4
        with:
          name: CalmTV-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionCode \K[0-9]+' src/app/build.gradle | head -1)
          cp src/app/build/outputs/apk/debug/app-debug.apk CalmTV.apk
          gh release delete "v$V" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "v$V" CalmTV.apk -R "$GITHUB_REPOSITORY" --title "CalmTV $V" --notes "CalmTV version $V" --target "$GITHUB_SHA" --latest
